name: Public engineering reference lab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check engineering-lab/access.mjs
          node --check engineering-lab/journal.mjs
          node --check engineering-lab/webhook.mjs
          node --check engineering-lab/lab.test.mjs
      - name: Test tenant boundaries, ledger invariants and event signatures
        run: node --test engineering-lab/lab.test.mjs
