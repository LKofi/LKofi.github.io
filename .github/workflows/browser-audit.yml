name: Portfolio browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Desktop and mobile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - name: Choose browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx --yes playwright@1.56.1 install --with-deps chromium
          fi
      - name: Launch local website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/seak-site.log 2>&1 &
          sleep 2
      - name: Exercise pages and capture reference screenshots
        run: node scripts/browser-audit.mjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-screenshots
          path: test-output/
          retention-days: 7
