name: Portfolio source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Validate portfolio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check website
        run: node scripts/check-site.mjs
# GitHub Pages native branch-based deployment remains enabled for main/root.
